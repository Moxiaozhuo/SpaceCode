org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation to avoid cache corruption on Windows
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
# Network retry and timeout settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Flutter Gradle 插件默认在 release 构建里强开 shrinkResources + minify（见 FlutterPlugin.kt）。
# 本项目的 app/build.gradle.kts 显式关闭了 isMinifyEnabled（R8 会裁掉 ML Kit 反射注册的类），
# 两者同时生效会让 AGP 在配置阶段报 "Removing unused resources requires unused code shrinking"。
# 置 false 让插件整段跳过收缩配置。
shrink=false
